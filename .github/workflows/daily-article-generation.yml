name: Daily Article Generation

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 8:00 AM）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      articles_per_category:
        description: '每个分类生成的文章数'
        required: false
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Check current article count
        id: check-count
        run: |
          ARTICLE_COUNT=$(node -e "const data=require('./lib/articles-data.json'); console.log(data.length);")
          echo "ARTICLE_COUNT=$ARTICLE_COUNT" >> $GITHUB_ENV
          echo "📊 当前文章数: $ARTICLE_COUNT"

      - name: Determine articles per category
        id: determine-count
        run: |
          ARTICLE_COUNT="${{ env.ARTICLE_COUNT }}"
          DEFAULT="${{ github.event.inputs.articles_per_category || '5' }}"

          if [ "$ARTICLE_COUNT" -ge 1000 ]; then
            echo "📉 文章数已达标，降低频率为每天每个分类1篇"
            echo "ARTICLES_PER_CATEGORY=1" >> $GITHUB_ENV
          else
            echo "📈 文章数未达标，继续高频生成（每个分类${DEFAULT}篇）"
            echo "ARTICLES_PER_CATEGORY=$DEFAULT" >> $GITHUB_ENV
          fi

      - name: Generate articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ARTICLES_PER_CATEGORY: ${{ env.ARTICLES_PER_CATEGORY }}
        run: |
          echo "🚀 开始生成文章..."
          echo "📝 每个分类生成 ${{ env.ARTICLES_PER_CATEGORY }} 篇文章"

          cd backend

          # 运行批量生成脚本
          python batch_generate_and_save.py

      - name: Update frontend JSON
        run: |
          cd backend
          node manual-update-json.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 检查是否有更改
          if [[ -n $(git status --porcelain) ]]; then
            git add .

            # 生成提交消息
            ARTICLE_COUNT=$(node -e "const data=require('./lib/articles-data.json'); console.log(data.length);")
            DATE=$(date +'%Y-%m-%d')
            echo "📝 提交更改..."
            git commit -m "feat: daily article generation - $DATE" -m "✅ Generated new articles" -m "📊 Total articles: $ARTICLE_COUNT" -m "🤖 Auto-generated by GitHub Actions" -m "[skip-ci]"

            echo "📤 推送到GitHub..."
            git push

            echo "✅ 成功推送文章更新！"
          else
            echo "⚠️  没有新文章生成，跳过提交"
          fi

      - name: Summary
        if: always()
        run: |
          NEW_COUNT=$(node -e "const data=require('./lib/articles-data.json'); console.log(data.length);")
          OLD_COUNT="${{ env.ARTICLE_COUNT }}"

          echo "📊 生成报告"
          echo "=================================="
          echo "生成前: $OLD_COUNT 篇文章"
          echo "生成后: $NEW_COUNT 篇文章"
          echo "新增: $((NEW_COUNT - OLD_COUNT)) 篇文章"
          echo "=================================="

          if [ "$NEW_COUNT" -ge 1000 ]; then
            echo "🎉 已达到1000篇目标！"
            echo "📉 从明天起降低生成频率为每天每个分类1篇"
          else
            echo "📈 继续积累内容，距离1000篇还有 $((1000 - NEW_COUNT)) 篇"
          fi
# Auto-generated workflow file
