<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理控制台 - SmartHome TechHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #22d3ee;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            color: #94a3b8;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 10px 15px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-item:hover {
            background: rgba(34, 211, 238, 0.2);
            transform: translateX(5px);
        }

        .category-item.active {
            background: rgba(34, 211, 238, 0.3);
            border-color: rgba(34, 211, 238, 0.5);
        }

        .category-item .count {
            background: rgba(34, 211, 238, 0.2);
            color: #22d3ee;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .content-area {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.8);
        }

        .article-list {
            display: grid;
            gap: 15px;
        }

        .article-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s ease;
        }

        .article-item:hover {
            border-color: rgba(34, 211, 238, 0.3);
            transform: translateY(-2px);
        }

        .article-item h4 {
            color: #f1f5f9;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .article-item .meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .article-item .actions {
            display: flex;
            gap: 10px;
        }

        .article-item .actions button {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #22d3ee;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #22d3ee;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .response-message {
            display: none;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .response-message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .response-message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 SmartHome TechHub 文章管理控制台</h1>
            <p>通过API动态管理网站文章内容</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalCategories">7</div>
                <div class="label">文章分类</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalArticles">0</div>
                <div class="label">总文章数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="apiStatus">🔴</div>
                <div class="label">API状态</div>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>📂 文章分类</h3>
                <ul class="category-list" id="categoryList">
                    <!-- 分类列表将通过JS动态加载 -->
                </ul>
            </div>

            <div class="content-area">
                <div class="content-header">
                    <h2 id="currentCategory">所有文章</h2>
                    <button class="btn" onclick="showCreateModal()">+ 新建文章</button>
                </div>

                <div class="response-message" id="responseMessage"></div>

                <div class="article-list" id="articleList">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.707.293h3.172a3 3 0 013 3v1a3 3 0 01-3 3H9a3 3 0 01-3-3V6a3 3 0 013-3h2.172a1 1 0 01.707-.293l.414-.414a1 1 0 01.707 0H9" />
                        </svg>
                        <p>选择左侧分类查看文章，或点击"新建文章"创建内容</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建文章模态框 -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2>📝 新建文章</h2>
            <form id="articleForm">
                <div class="form-group">
                    <label for="articleTitle">文章标题 *</label>
                    <input type="text" id="articleTitle" required>
                </div>

                <div class="form-group">
                    <label for="articleSlug">URL Slug *</label>
                    <input type="text" id="articleSlug" required placeholder="article-slug">
                </div>

                <div class="form-group">
                    <label for="articleCategory">分类 *</label>
                    <select id="articleCategory" required>
                        <option value="">选择分类</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="articleAuthor">作者 *</label>
                    <input type="text" id="articleAuthor" required value="SmartHome TechHub Editorial Team">
                </div>

                <div class="form-group">
                    <label for="articleContent">文章内容 *</label>
                    <textarea id="articleContent" rows="10" required placeholder="支持Markdown格式"></textarea>
                </div>

                <div class="form-group">
                    <label for="articleTags">标签 (逗号分隔)</label>
                    <input type="text" id="articleTags" placeholder="review, 2026">
                </div>

                <div class="form-group">
                    <label for="articleImage">封面图片URL</label>
                    <input type="url" id="articleImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label for="articleRating">评分 (1-5)</label>
                    <input type="number" id="articleRating" min="1" max="5" step="0.1" value="4.5">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">取消</button>
                    <button type="submit" class="btn">发布文章</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol + '//' + window.location.hostname + ':3001/api';

        // 检查API状态
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('apiStatus').textContent = '🟢';
                document.getElementById('apiStatus').title = 'API正常';
                return true;
            } catch (error) {
                document.getElementById('apiStatus').textContent = '🔴';
                document.getElementById('apiStatus').title = 'API离线';
                return false;
            }
        }

        // 加载分类列表
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const data = await response.json();

                if (data.success) {
                    const categoryList = document.getElementById('categoryList');
                    const categorySelect = document.getElementById('articleCategory');

                    categoryList.innerHTML = '';
                    categorySelect.innerHTML = '<option value="">选择分类</option>';

                    let totalArticles = 0;

                    data.categories.forEach(category => {
                        totalArticles += category.count;

                        const li = document.createElement('li');
                        li.className = 'category-item';
                        li.innerHTML = `
                            <span>${category.name}</span>
                            <span class="count">${category.count}</span>
                        `;
                        li.onclick = () => loadArticles(category.slug, category.name);
                        categoryList.appendChild(li);

                        const option = document.createElement('option');
                        option.value = category.slug;
                        option.textContent = category.name;
                        categorySelect.appendChild(option);
                    });

                    document.getElementById('totalArticles').textContent = totalArticles;
                }
            } catch (error) {
                showResponse('error', '加载分类失败: ' + error.message);
            }
        }

        // 加载文章列表
        async function loadArticles(category, categoryName) {
            try {
                const response = await fetch(`${API_BASE}/articles/${category}`);
                const data = await response.json();

                document.getElementById('currentCategory').textContent = categoryName || '所有文章';

                const articleList = document.getElementById('articleList');

                if (data.success && data.articles.length > 0) {
                    articleList.innerHTML = data.articles.map(article => `
                        <div class="article-item">
                            <h4>${article.title}</h4>
                            <div class="meta">
                                <span>👤 ${article.author}</span>
                                <span>📅 ${article.date}</span>
                                <span>⭐ ${article.rating || 'N/A'}</span>
                            </div>
                            <div class="actions">
                                <button class="btn btn-secondary" onclick="editArticle('${category}', '${article.slug}')">编辑</button>
                                <button class="btn btn-secondary" onclick="deleteArticle('${category}', '${article.slug}')">删除</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    articleList.innerHTML = `
                        <div class="empty-state">
                            <p>该分类下暂无文章</p>
                        </div>
                    `;
                }
            } catch (error) {
                showResponse('error', '加载文章失败: ' + error.message);
            }
        }

        // 显示响应消息
        function showResponse(type, message) {
            const responseDiv = document.getElementById('responseMessage');
            responseDiv.className = `response-message ${type}`;
            responseDiv.textContent = message;
            responseDiv.style.display = 'block';

            setTimeout(() => {
                responseDiv.style.display = 'none';
            }, 5000);
        }

        // 显示/隐藏模态框
        function showCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        // 表单提交
        document.getElementById('articleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                title: document.getElementById('articleTitle').value,
                slug: document.getElementById('articleSlug').value,
                category: document.getElementById('articleCategory').value,
                author: document.getElementById('articleAuthor').value,
                content: document.getElementById('articleContent').value,
                tags: document.getElementById('articleTags').value.split(',').map(t => t.trim()),
                featuredImage: document.getElementById('articleImage').value,
                rating: parseFloat(document.getElementById('articleRating').value)
            };

            try {
                const response = await fetch(`${API_BASE}/articles`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showResponse('success', '文章发布成功！');
                    closeCreateModal();
                    loadCategories();
                    // 重新加载当前分类
                    if (formData.category) {
                        setTimeout(() => {
                            loadArticles(formData.category, document.getElementById('articleCategory').options[document.getElementById('articleCategory').selectedIndex].text);
                        }, 500);
                    }
                } else {
                    showResponse('error', '发布失败: ' + data.error);
                }
            } catch (error) {
                showResponse('error', '发布失败: ' + error.message);
            }
        });

        // 删除文章
        async function deleteArticle(category, slug) {
            if (!confirm('确定要删除这篇文章吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/articles/${category}/${slug}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showResponse('success', '文章删除成功！');
                    loadArticles(category, document.getElementById('currentCategory').textContent);
                    loadCategories();
                } else {
                    showResponse('error', '删除失败: ' + data.error);
                }
            } catch (error) {
                showResponse('error', '删除失败: ' + error.message);
            }
        }

        // 编辑文章 (简化版)
        function editArticle(category, slug) {
            alert('编辑功能开发中...\n\n你可以通过以下方式编辑：\\n1. 直接编辑 markdown 文件\\n2. 删除后重新创建');
        }

        // 页面加载时初始化
        checkApiStatus();
        loadCategories();
    </script>
</body>
</html>
